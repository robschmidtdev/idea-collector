<div class="list-group-item list-group-item-{{ item.color }} d-flex justify-content-between align-items-center py-3 position-relative {% if item.pinned %}pinned pinned-item{% endif %}" {% if item.pinned %}draggable="true"{% endif %} data-pk="{{ item.pk }}" data-name="{{ item.name }}" data-tags="{% for tag in item.tags.all %}{{ tag.pk }}{% if not forloop.last %},{% endif %}{% endfor %}" data-search="{{ item.name }} {{ item.get_plain_description|truncatechars:200 }} {% for tag in item.tags.all %}{{ tag.name }} {% endfor %}{% for image in item.images.all %}{{ image.image.name }} {% endfor %}{% for video in item.videos.all %}{{ video.video.name }} {% endfor %}{% for audio in item.audios.all %}{{ audio.audio.name }} {% endfor %}{% if item.created_by %}{{ item.created_by.username }}{% endif %}" data-pinned="{{ item.pinned|yesno:'true,false' }}" data-color="{{ item.color }}" data-has-images="{% if item.images.all %}true{% else %}false{% endif %}" data-has-videos="{% if item.videos.all %}true{% else %}false{% endif %}" data-has-audios="{% if item.audios.all %}true{% else %}false{% endif %}" data-has-references="{% if item.referenced_items.all %}true{% else %}false{% endif %}">
    <a href="{% url 'item_detail' item.pk %}" class="list-group-item-action flex-grow-1 d-flex flex-column text-decoration-none text-reset">
        <div class="fw-bold fs-5">{{ item.name }}</div>
        {% if item.description %}
            <div class="text-muted mb-2 text-truncate" style="max-width: 600px;">
                {{ item.get_plain_description|truncatechars:200 }}
            </div>
        {% endif %}

        {% if item.tags.all %}
            <div class="mt-1">
                {% for tag in item.tags.all %}
                    <span class="badge me-1" style="background-color: {{ tag.color }};">{{ tag.name }}</span>
                {% endfor %}
            </div>
        {% endif %}
    </a>
    <button type="button" class="btn btn-link text-dark p-0 ms-3 pin-btn" data-pk="{{ item.pk }}" data-pinned="{{ item.pinned|yesno:'true,false' }}" title="{% if item.pinned %}Unpin{% else %}Pin{% endif %}">
        <i class="bi {% if item.pinned %}bi-pin-fill{% else %}bi-pin{% endif %} fs-4"></i>
    </button>
</div>
