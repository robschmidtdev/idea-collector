<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ settings.title }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            color: {{ settings.text_color }};
        }
        /* Example: using the primary color for headings or navbar accents */
        .custom-primary {
            background-color: {{ settings.primary_color }} !important;
            border-color: {{ settings.primary_color }} !important;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="custom-primary">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'items' %}">{{ settings.title }}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        {% comment %} <a class="nav-link {% if active == 'items' %}active{% endif %}" href="{% url 'items' %}">Items</a> {% endcomment %}
                    </li>
                    <li class="nav-item">
                        {% comment %} <a class="nav-link" href="{% url 'settings' %}">Settings</a> {% endcomment %}
                        <a class="nav-link {% if active == 'settings' %}active{% endif %}" href="{% url 'settings' %}">Settings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
