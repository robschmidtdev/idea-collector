<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ settings.title }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .custom-primary {
            background-color: {{ settings.primary_color }} !important;
            border-color: {{ settings.primary_color }} !important;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="custom-primary">
    <nav class="navbar navbar-expand-sm bg-light navbar-light fixed-top mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'items' %}">{{ settings.title }}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                    </li>
                    <li><a class="nav-link" href="{% url 'item_create' %}"><i class="bi bi-plus-circle"></i></a></li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'settings' %}active{% endif %}" href="{% url 'settings' %}"><i class="bi bi-gear"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 90px; margin-bottom: 90px;">
        {% block content %}{% endblock %}
    </div>

    <nav class="navbar navbar-expand-sm bg-light navbar-light fixed-bottom">
        <div class="container-fluid d-flex justify-content-center">
            <a class="navbar-brand m-0 fs-6" href="https://www.xyz.com" target="_blank" rel="noopener noreferrer"><small>developed by: www.xyz.com</small></a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
