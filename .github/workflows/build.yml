name: Desktop build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: idea-collector-linux
          - os: macos-latest
            artifact_name: idea-collector-macos
          - os: windows-latest
            artifact_name: idea-collector-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build desktop app
        run: python -m PyInstaller --noconfirm --clean idea-collector.spec

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:IDEACOLLECTOR_DATA_DIR = Join-Path $env:RUNNER_TEMP "idea-collector-test"
          & "dist\IdeaCollector\IdeaCollector.exe" --self-test
          exit $LASTEXITCODE

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export IDEACOLLECTOR_DATA_DIR="$RUNNER_TEMP/idea-collector-test"
          "dist/IdeaCollector.app/Contents/MacOS/IdeaCollector" --self-test

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export IDEACOLLECTOR_DATA_DIR="$RUNNER_TEMP/idea-collector-test"
          "dist/IdeaCollector/IdeaCollector" --self-test

      - name: Package build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\IdeaCollector\*" -DestinationPath "dist\idea-collector-windows.zip"

      - name: Package build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/IdeaCollector.app" "dist/idea-collector-macos.zip"

      - name: Package build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          zip -r idea-collector-linux.zip IdeaCollector

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.zip
          if-no-files-found: error
