name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build source archive
        run: |
          set -euo pipefail
          git archive --format=zip \
            --prefix="idea-collector-${GITHUB_REF_NAME}/" \
            -o "release-assets/idea-collector-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.zip \
            --title "Idea Collector ${GITHUB_REF_NAME}" \
            --generate-notes
