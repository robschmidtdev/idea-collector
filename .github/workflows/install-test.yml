name: Installation test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv venv
          venv/Scripts/python.exe -m pip install --upgrade pip
          venv/Scripts/python.exe -m pip install -r requirements.txt

      - name: Install, start and test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          IDEACOLLECTOR_DATA_DIR: ${{ runner.temp }}/idea-collector-test
          IDEACOLLECTOR_STARTUP_TIMEOUT: 180
          no_proxy: 127.0.0.1,localhost
          NO_PROXY: 127.0.0.1,localhost
        run: |
          set -euo pipefail
          chmod +x start_ideacollector.sh
          nohup ./start_ideacollector.sh --no-window > installer.log 2>&1 &
          installer_pid=$!
          cleanup() {
            echo "----- installer.log -----"
            cat installer.log 2>/dev/null || true
            kill "$installer_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          is_up=false
          for attempt in $(seq 1 180); do
            if curl -fsS --noproxy '*' http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "Server is up after ${attempt}s"
              is_up=true
              break
            fi
            sleep 1
          done

          if [ "$is_up" != true ]; then
            echo "Server did not start within 180 seconds"
            exit 1
          fi

          venv/bin/python idea_collector/manage.py test

      - name: Install, start and test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $exitCode = 0

          $installer = Start-Process -FilePath "cmd.exe" `
            -ArgumentList "/c", "start_ideacollector.bat --no-window" `
            -RedirectStandardOutput "installer.log" `
            -RedirectStandardError "installer.err" `
            -NoNewWindow -PassThru

          try {
            $isUp = $false
            for ($attempt = 1; $attempt -le 180; $attempt++) {
              $client = New-Object System.Net.Sockets.TcpClient
              try {
                $async = $client.BeginConnect("127.0.0.1", 8000, $null, $null)
                if ($async.AsyncWaitHandle.WaitOne(1000) -and $client.Connected) {
                  $isUp = $true
                  Write-Output "Server is up after $attempt seconds"
                  break
                }
              } catch {
              } finally {
                $client.Close()
              }
              Start-Sleep -Seconds 1
            }

            if (-not $isUp) {
              Write-Output "Server did not start within 180 seconds"
              $exitCode = 1
            } else {
              & venv\Scripts\python.exe idea_collector\manage.py test
              $exitCode = $LASTEXITCODE
            }
          } finally {
            if (-not $installer.HasExited) {
              taskkill.exe /PID $installer.Id /T /F 2>$null | Out-Null
            }
            Write-Output "----- installer.log -----"
            if (Test-Path installer.log) { Get-Content installer.log }
            if (Test-Path installer.err) { Get-Content installer.err }
          }

          exit $exitCode
